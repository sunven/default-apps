function appIcon(a){const asset={Preview:'preview','Google Chrome':'chrome',Safari:'safari',Mail:'mail',TextEdit:'textedit',Books:'books'}[a?.rawName];return asset?`<img class="app-icon" src="${iconAssets[asset]}" alt="">`:'<span class="fallback" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18M7 6.5h1m2 0h1M8 13h8m-8 3h5"/></svg></span>';}
const norm=v=>String(v).trim().toLocaleLowerCase();
function assocMatch(a,q){const s=norm(q).replace(/^\./,'').replace(/:$/,'');return !s||norm([a.name,a.type,...a.tags].join(' ')).includes(s);}
function appMatch(a){const q=norm(appQuery);if(!q)return 'all';if(norm([a.name,a.rawName,a.version,a.path,a.bundle].join(' ')).includes(q))return 'app';return a.declared.some(id=>assocMatch(byID[id],q))?'declaration':null;}
function appList(){return apps.filter(a=>!removed.has(a.id)&&appMatch(a));}
function rowList(){let list;if(view==='apps'){const app=appByID[selectedApp];if(!app||removed.has(app.id)||!appMatch(app))return [];list=app.declared.map(id=>byID[id]);if(appMatch(app)==='declaration')list=list.filter(a=>assocMatch(a,appQuery));}else list=associations.filter(a=>view==='urls'?a.kind==='url':a.kind!=='url');return list.filter(a=>assocMatch(a,queries[view]));}
function normalize(){if(!selectedApp)selectedApp=appList()[0]?.id||null;if(selectedApp&&!removed.has(selectedApp)&&!appList().some(a=>a.id===selectedApp))selectedApp=appList()[0]?.id||null;const rows=rowList();if(!rows.some(a=>a.id===selections[view]))selections[view]=rows[0]?.id||null;}
function savePosition(){return ['app-list','rows','sheet'].map(id=>[id,$('#'+id).scrollTop]);}
function restorePosition(p){p.forEach(([id,y])=>$('#'+id).scrollTop=y);}
function rememberFocus(){const el=document.activeElement;return el?.dataset.focus?el.dataset.focus:null;}
function restoreFocus(key){if(!key)return;const target=[...document.querySelectorAll('[data-focus]')].find(e=>e.dataset.focus===key);target?.focus({preventScroll:true});}
function isLocked(){return op&&['waiting','readback'].includes(op.phase);}
function empty(title,text){return `<div class="empty"><h2>${esc(title)}</h2><p>${esc(text)}</p><div class="actions"><button data-action="clear">清除搜索</button><button data-view="files">查看文件类型</button><button data-view="urls">查看 URL 协议</button></div></div>`;}
function currentHTML(a){const cur=appByID[defaults[a.id]];return cur?`${appIcon(cur)}<span class="copy"><strong>${esc(cur.name)}${removed.has(cur.id)?' · 已不在目录中':''}</strong><small>${esc(cur.path)}</small></span>`:`<span class="copy"><strong>${a.unresolved?'尚未解析为类型':'未提供模拟值'}</strong><small>${a.unresolved?'解析完成前不能修改':'在详情中可体验模拟选择'}</small></span>`;}
function opLabel(){return !op?'':({waiting:'等待系统确认或返回',readback:'系统已返回成功，等待回读',confirmed:'本次修改已回读确认',different:'回读与目标不同',recovered:'上次修改结果未知'})[op.phase];}
function render(){const pos=savePosition(),focus=rememberFocus();normalize();document.body.className='mode-'+mode;$('#app-search').value=appQuery;$('#assoc-search').value=queries[view];document.querySelectorAll('.nav [data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===view));
const list=appList(),app=appByID[selectedApp],rows=rowList();$('#app-count').textContent=list.length+' / '+(apps.length-removed.size);$('#app-list').innerHTML=list.length?list.map(a=>`<div role="option" class="app-option" tabindex="${a.id===selectedApp||(!list.some(x=>x.id===selectedApp)&&a.id===list[0]?.id)?0:-1}" aria-selected="${a.id===selectedApp}" data-app="${a.id}" data-focus="app:${a.id}" title="${esc(a.path)}">${appIcon(a)}<span class="copy"><strong>${esc(a.name)}</strong><small>${esc(a.version)} · ${a.declared.length} 项声明</small><small>${esc(a.path)}</small></span></div>`).join(''):'<p class="empty">没有匹配的应用。</p>';
if(view==='apps'){$('#scope').innerHTML=app?`${appIcon(app)}<div><h1>${esc(app.name)}${removed.has(app.id)?' · 已消失':''}</h1><p class="path">${esc(app.version)} · ${esc(app.path)}</p></div>`:'<div><h1>没有匹配的应用</h1></div>';$('#match-note').textContent=removed.has(selectedApp)?'刷新后找不到原安装位置。没有自动选择同名副本。':app?`${appMatch(app)==='declaration'?'匹配声明：仅显示符合应用搜索的关联项。':'应用信息匹配：显示此副本全部声明。'} 声明支持不等于当前默认。`:'清除搜索或切换到文件类型、URL 协议继续查找。';}
else{$('#scope').innerHTML=`<div><h1>${viewNames[view]}</h1><p class="path">按关联项独立查询当前默认应用</p></div>`;$('#match-note').textContent=view==='files'?'相同扩展名可能对应多个类型，各自显示类型标识与当前默认。':'每个协议分别修改；HTTP 与 HTTPS 独立显示。';}
$('#assoc-count').textContent=rows.length+' 项';$('#rows').innerHTML=rows.length?rows.map(a=>{const selected=selections[view]===a.id;const target=view==='apps'?app:null;const disabled=isLocked()||a.unresolved||!target||removed.has(target?.id)||defaults[a.id]===target.id;return `<div class="row" data-selected="${selected}" data-row="${esc(a.id)}"><button class="type-name" data-assoc="${esc(a.id)}" data-focus="assoc:${esc(a.id)}" tabindex="${selected?0:-1}"><span><strong>${esc(a.name)}</strong><small>${esc(a.kind==='url'?a.type+':':a.tags.length?a.tags.map(t=>'.'+t).join(' · '):a.type)}</small>${a.tags.length&&a.kind==='file'?`<small>${esc(a.type)}</small>`:''}${op?.assoc===a.id?`<span class="row-state">${opLabel()}</span>`:''}</span></button><div class="current">${currentHTML(a)}</div><div class="row-actions">${target?`<button data-submit="${target.id}" data-for="${esc(a.id)}" data-focus="set:${esc(a.id)}" tabindex="${selected?0:-1}" ${disabled?'disabled':''}>${defaults[a.id]===target.id?'当前为此副本':'设为此应用'}</button>`:''}<button data-detail="${esc(a.id)}" data-focus="detail:${esc(a.id)}" tabindex="${selected?0:-1}">详情…</button></div></div>`}).join(''):empty(removed.has(selectedApp)&&view==='apps'?'原应用副本已不在目录中':view==='apps'&&!selectedApp?'没有匹配的应用':app?.declared.length===0&&view==='apps'?'此应用没有声明支持的关联项':'没有匹配的关联项',view==='apps'&&app?.declared.length===0?'仍可从文件类型或 URL 协议查看系统候选，并手动选择应用。':'旧详情已清空。可清除搜索或改用其他入口。');
$('#foot').textContent=`${viewNames[view]} · ${rows.length} 项 · ${queryVersion?'第 '+queryVersion+' 次模拟查询':'初始模拟查询'} · Tab 跨区域，列表内 ↑ ↓ 选择，Enter 打开详情`;
$('#operation').hidden=!op;if(op){const a=byID[op.assoc],target=appByID[op.target];$('#operation').innerHTML=`<div><p><strong>${esc(a.name)} · ${opLabel()}</strong> · ${isLocked()?'其他修改暂停，仍可浏览和查询':'可查看当前默认并手动改选'}</p><small>所选目标：${esc(target.name)} · ${esc(target.path)}</small></div><button data-jump="${esc(a.id)}">查看请求项</button>`;}
$('#callback').disabled=op?.phase!=='waiting';$('#readback').disabled=!op;$('#lab-note').textContent=notice||`实机 ${sampled.summary.appCopies} 份应用 + ${apps.length-sampled.summary.appCopies} 份压力样本；当前默认及系统候选均为模拟。`;$('#variant-label').innerHTML=labels[mode]+'<small>仅比较滚动 · 原型控制栏</small>';restorePosition(pos);restoreFocus(focus);if($('#detail').open)renderDetail();}
function announce(s){notice=s;$('#live').textContent=s;}
function showSelectedApp(){const el=$('#app-list [aria-selected=true]');if(el)$('#app-list').scrollTop=el.offsetTop-$('#app-list').offsetTop;}
function selectApp(id,focus=false){selectedApp=id;view='apps';selections.apps=null;render();$('#rows').scrollTop=0;if(focus){const e=[...document.querySelectorAll('[data-app]')].find(e=>e.dataset.app===id);e?.focus({preventScroll:true});e?.scrollIntoView({block:'nearest'});}}
function selectAssoc(id,focus=false){selections[view]=id;render();if(focus){const e=[...document.querySelectorAll('[data-assoc]')].find(e=>e.dataset.assoc===id);e?.focus({preventScroll:true});e?.scrollIntoView({block:'nearest'});}}
const viewScroll={apps:0,files:0,urls:0};
function setView(next){viewScroll[view]=$('#rows').scrollTop;view=next;render();$('#rows').scrollTop=viewScroll[next];}
function openDetail(id){detailsID=id;detailOther=false;lastFocus=rememberFocus();renderDetail();$('#detail').showModal();}
function renderDetail(){const focus=rememberFocus(),a=byID[detailsID];if(!a)return;$('#detail-title').textContent=a.name;$('#detail-subtitle').textContent=(a.kind==='url'?a.type+':':a.type)+(a.fixture?' · 压力样本':'');const list=(detailOther?apps.map(a=>a.id):(candidates[a.id]||[])).filter(id=>!removed.has(id));$('#detail-body').innerHTML=`<section><h3>当前默认应用</h3><div class="current">${currentHTML(a)}</div><div class="actions"><button data-query="${esc(a.id)}" data-focus="query">重新查询</button></div></section>${op?.assoc===a.id?`<div class="notice">${opLabel()}<br>目标：${esc(appByID[op.target].path)}${op.phase==='recovered'?'<br>当前查询即使等于目标，也不能证明上次请求的完整结果。':''}</div>`:''}<section><h3>${detailOther?'手动选择应用（模拟文件选择器）':'系统候选应用（模拟查询）'}</h3><p>${detailOther?'手动选择可以超出声明范围，以实际结果为准。':'此列表独立于应用声明。没有候选时仍可手动选择。'}</p>${a.unresolved?'<div class="notice warning">此项只有原始扩展名，原型没有解析为可用文件类型，因此禁用修改。</div>':''}${list.length?list.map(id=>{const c=appByID[id];return `<div class="candidate">${appIcon(c)}<span class="copy"><strong>${esc(c.name)}</strong><small>${esc(c.version)} · ${esc(c.path)}</small></span><button data-submit="${c.id}" data-for="${esc(a.id)}" data-focus="candidate:${c.id}" ${isLocked()||a.unresolved||defaults[a.id]===c.id?'disabled':''}>${defaults[a.id]===c.id?'当前副本':'设为默认'}</button></div>`}).join(''):'<p class="subline">模拟查询没有返回候选。</p>'}<div class="actions"><button data-action="other" ${detailOther?'disabled':''}>选择其他应用…</button></div></section>`;restoreFocus(focus);}
function submit(assoc,target,ack=false){if(isLocked()||removed.has(target)||byID[assoc].unresolved)return;if(op?.phase==='recovered'&&!ack){$('#info-title').textContent='上次请求仍可能完成';$('#info-body').innerHTML=`<p>上次对 ${esc(byID[op.assoc].name)} 的请求结果未知，系统可能稍后采用 ${esc(appByID[op.target].path)}。</p><p class="subline">本次将明确发起一项新修改：${esc(byID[assoc].name)} → ${esc(appByID[target].path)}。不会自动重发上次请求。</p><div class="actions"><button data-close="info">返回</button><button class="primary" data-ack="${target}" data-for="${esc(assoc)}">仍然提交本次修改</button></div>`;$('#info').showModal();return;}
op={id:++opCounter,assoc,target,phase:'waiting'};announce('已提交一项模拟修改。当前默认仍来自上次查询；切换页面不会丢失等待状态。');render();}
function queryOne(id){defaults[id]=systemDefaults[id];queryVersion++;if(op?.assoc===id&&op.phase==='readback')op.phase=defaults[id]===op.target?'confirmed':'different';announce('已查询实际模拟值；待决请求或旧进程请求不会因为查询匹配而变为成功。');render();}
function setMode(next){mode=next;const url=new URL(location.href);url.searchParams.set('variant',mode.toUpperCase());history.replaceState(null,'',url);render();console.log('Desktop workflow state',snapshot());}
function snapshot(){return {mode,view,appQuery,queries,selectedApp,selections,removed:[...removed],op,defaults,systemDefaults,queryVersion,appCount:apps.length,associationCount:associations.length};}window.desktopSnapshot=snapshot;
function runScenario(name){reset();if(name==='long'){selectedApp=xcode.id;announce('Xcode 的 168 项原始类型／协议／扩展名声明来自实机抽样；需要更长列表可搜索“压力样本”。');}if(name==='empty'){appQuery='zzzz-no-match';announce('无匹配应用时清空关联详情。清除搜索可回到可见目录。');}if(name==='no-support'){selectedApp=calculator.id;announce('计算器的 Info.plist 未提供文稿或 URL 声明；可从另外两个入口继续。');}if(name==='copies'){appQuery='Preview';selectedApp=clone.id;announce('预览副本为压力样本；同名副本按路径分别选择，详情显示完整安装位置。');}if(name==='ambiguous'){view='files';queries.files='.jpg';selections.files=jpeg;announce('JPEG 图像与 JPEG 工作流样本共享 .jpg，仍是两个关联项。');}if(name==='missing'){selectedApp=preview.id;removed.add(preview.id);announce('目录已移除原预览副本，保留消失提示。当前默认仍按最近查询记录显示路径。');}if(name==='pending'){selectedApp=preview.id;submit(pdf,preview.id);announce('PDF 请求已提交。切到 URL 协议并刷新，等待状态和所选目标仍保留。');}if(name==='recovered'){op={id:++opCounter,assoc:pdf,target:preview.id,phase:'recovered'};systemDefaults[pdf]=preview.id;defaults[pdf]=preview.id;announce('模拟重新打开后的查询：当前等于目标，旧请求仍未知；再次修改先显示旧请求可能晚到的说明。');}render();$('#app-list').scrollTop=0;showSelectedApp();$('#rows').scrollTop=0;$('#sheet').scrollTop=0;}
function showInfo(title,html){$('#info-title').textContent=title;$('#info-body').innerHTML=html;$('#info').showModal();}
document.addEventListener('click',e=>{const app=e.target.closest('[data-app]');if(app){selectApp(app.dataset.app,true);return;}const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.close){$('#'+b.dataset.close).close();return;}if(b.dataset.view){setView(b.dataset.view);return;}if(b.dataset.assoc){selectAssoc(b.dataset.assoc,true);return;}if(b.dataset.detail){selectAssoc(b.dataset.detail);openDetail(b.dataset.detail);return;}if(b.dataset.submit){submit(b.dataset.for,b.dataset.submit);return;}if(b.dataset.ack){$('#info').close();submit(b.dataset.for,b.dataset.ack,true);return;}if(b.dataset.query){queryOne(b.dataset.query);return;}if(b.dataset.jump){view=byID[b.dataset.jump].kind==='url'?'urls':'files';queries[view]='';selections[view]=b.dataset.jump;render();openDetail(b.dataset.jump);return;}if(b.dataset.action==='clear'){appQuery='';queries[view]='';if(removed.has(selectedApp))selectedApp=null;render();$('#app-search').focus();return;}if(b.dataset.action==='other'){detailOther=true;renderDetail();return;}
if(b.id==='prev'||b.id==='next'){const list=['a','b','c'];setMode(list[(list.indexOf(mode)+(b.id==='next'?1:2))%3]);}
if(b.id==='reset')reset();if(b.id==='run-scenario')runScenario($('#scenario').value);
if(b.id==='refresh'){systemDefaults[pdf]=systemDefaults[pdf]===chrome.id?preview.id:chrome.id;defaults={...systemDefaults};queryVersion++;announce('模拟外部变更后刷新：PDF 当前默认已变化；选中项与请求目标保留，等待阶段没有结束。');render();}
if(b.id==='callback'&&op?.phase==='waiting'){op.phase='readback';systemDefaults[op.assoc]=op.target;announce('系统已返回成功；列表仍显示上次查询，需要回读后确认路径。');render();}
if(b.id==='readback'&&op)queryOne(op.assoc);
if(b.id==='catalog-info')showInfo('数据来源与原型边界',`<p>2026-11-05 只读扫描三个常规目录：${sampled.summary.appCopies} 份应用，${sampled.summary.withoutDocumentOrURLDeclarations} 份没有文稿／协议声明；${sampled.summary.uniqueRawDocumentUTIs} 个原始类型标识，${sampled.summary.uniqueRawExtensions} 个扩展名，${sampled.summary.uniqueURLSchemes} 个协议。</p><p class="subline">列表保留实机名称、版本、路径和声明。未调用 UTType 解析：旧式扩展名单列为未解析，类型标识也只代表原始声明。候选和当前默认全为模拟，没有读取或修改真实默认设置。</p><p class="subline">额外压力样本：一份预览副本、一份长名称应用、180 个格式和一个同 .jpg 的类型。图标复用之前只读提取的本机图标。</p><p class="subline">建议最小内容区域 1000 × 700，另验证 960 × 640。⌘F 聚焦当前入口搜索，⌘1/2/3 切换入口；方向键只作用于所在列表；Escape 关闭对话框并回到触发控件，在搜索框中清空该搜索。</p>`);
if(b.id==='state')showInfo('内存状态（原型诊断）','<pre>'+esc(JSON.stringify(snapshot(),null,2))+'</pre>');});
$('#app-search').addEventListener('input',e=>{appQuery=e.target.value;selectedApp=null;view='apps';selectedApp=appList()[0]?.id||null;render();$('#app-list').scrollTop=0;$('#rows').scrollTop=0;});$('#assoc-search').addEventListener('input',e=>{queries[view]=e.target.value;render();$('#rows').scrollTop=0;});
document.addEventListener('keydown',e=>{if(e.isComposing)return;const modal=$('#info').open||$('#detail').open;if(modal)return;if(e.metaKey&&e.key.toLowerCase()==='f'){e.preventDefault();(view==='apps'?$('#app-search'):$('#assoc-search')).focus();return;}if(e.metaKey&&['1','2','3'].includes(e.key)){e.preventDefault();setView(['apps','files','urls'][Number(e.key)-1]);$('.nav [data-view="'+view+'"]').focus();return;}if(e.target.matches('input')){if(e.key==='ArrowDown'){e.preventDefault();if(e.target.id==='app-search'){const first=appList()[0];if(first)selectApp(first.id,true);}else{const first=rowList()[0];if(first)selectAssoc(first.id,true);}return;}if(e.key==='Escape'){e.preventDefault();if(e.target.id==='app-search'){appQuery='';selectedApp=appList()[0]?.id||null;}else queries[view]='';render();}return;}
const item=e.target.closest('[data-app],[data-assoc]');if(item){const isApp=!!item.dataset.app;const list=isApp?appList():rowList();const id=isApp?item.dataset.app:item.dataset.assoc;let index=list.findIndex(a=>a.id===id);if(['ArrowDown','ArrowUp','Home','End'].includes(e.key)){e.preventDefault();index=e.key==='Home'?0:e.key==='End'?list.length-1:Math.max(0,Math.min(list.length-1,index+(e.key==='ArrowDown'?1:-1)));if(list[index])isApp?selectApp(list[index].id,true):selectAssoc(list[index].id,true);}if(e.key==='Enter'){e.preventDefault();if(isApp){selectApp(id);const first=rowList()[0];if(first)selectAssoc(first.id,true);else $('#assoc-search').focus();}else openDetail(id);}return;}
if(e.target.closest('.switcher')&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();const list=['a','b','c'];setMode(list[(list.indexOf(mode)+(e.key==='ArrowRight'?1:2))%3]);}});
$('#detail').addEventListener('close',()=>{restoreFocus(lastFocus);});
const initial=new URL(location.href).searchParams.get('variant')?.toLowerCase();if(['a','b','c'].includes(initial))mode=initial;reset();setMode(mode);
</script></body></html>
